<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BRACU Social</title>
    <!-- Nunito Sans: one font family only across the entire site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400;1,6..12,600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           BRACU Social - Design System Variables & Reset
           ========================================================================== */
        :root {
            --bg-page: #F5F3EA;
            --surface-card: #FFFFFF;
            --text-primary: #30352D;
            --text-secondary: #646A60;
            --border: #E5E5DA;
            --bg-hover: #F5F3EA;
            --header-bg: #91A77C;
            --header-hover: #82996C;
            --primary: #526747;
            --primary-hover: #435639;
            --moss: #737F53;
            --active-tint: #E9EEE1;
            --destructive: #8C3B32;
            --destructive-tint: #F4E7E3;
            --label-lost-text: #5E4A1F;
            --label-lost-bg: #EFE8D3;
            --label-found-text: #3F5236;
            --label-found-bg: #E3EAD9;
            --label-solved-text: #FFFFFF;
            --label-solved-bg: #526747;
            --radius-card: 10px;
            --radius-ctrl: 8px;
            --radius-pill: 999px;
            --shadow-card: 0 1px 2px rgba(48,53,45,.06);
            --header-height: 64px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #1A1D17;
                --surface-card: #23271F;
                --text-primary: #E8E8DD;
                --text-secondary: #A4A99A;
                --border: #34382E;
                --bg-hover: #2C3025;
                --header-bg: #3A4A33;
                --header-hover: #45573D;
                --primary: #91A77C;
                --primary-hover: #A0B68B;
                --moss: #737F53;
                --active-tint: #2F3A28;
                --destructive: #E0A196;
                --destructive-tint: #3B2624;
                --label-lost-text: #EFE8D3;
                --label-lost-bg: #4A3E20;
                --label-found-text: #E3EAD9;
                --label-found-bg: #2B3A24;
                --label-solved-text: #1A2414;
                --label-solved-bg: #91A77C;
                --shadow-card: none;
            }
        }

        /* Zero animations, zero transitions, solid colors only */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: none !important;
            animation: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito Sans', system-ui, Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        input, textarea, button, select {
            font-family: 'Nunito Sans', system-ui, Arial, sans-serif;
            font-size: 15px;
            color: var(--text-primary);
        }

        /* Focus Ring */
        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Typography */
        h1 {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-primary);
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-bottom: 20px;
        }

        .text-muted {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ==========================================================================
           Sticky Header
           ========================================================================== */
        header.site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-height);
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            padding-top: env(safe-area-inset-top);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .logo-box {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background-color: var(--primary);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .header-search {
            flex: 1;
            max-width: 640px;
            margin: 0 24px;
            position: relative;
        }

        .search-field-wrap {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-field-wrap svg {
            position: absolute;
            left: 14px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-field-wrap input {
            width: 100%;
            height: 40px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 0 16px 0 42px;
            font-size: 14px;
        }

        .search-field-wrap input:focus {
            border-color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            position: relative;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-ctrl);
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            position: relative;
        }

        .icon-btn:hover {
            background-color: var(--header-hover);
        }

        .badge-pill {
            position: absolute;
            top: 4px;
            right: 4px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background-color: var(--destructive);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 700;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            user-select: none;
            flex-shrink: 0;
        }

        .avatar.sm {
            width: 32px;
            height: 32px;
            font-size: 13px;
        }

        .avatar.lg {
            width: 88px;
            height: 88px;
            font-size: 32px;
            font-weight: 700;
        }

        .avatar-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        /* Popovers */
        .popover-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            z-index: 150;
            display: none;
        }

        .popover-menu.open {
            display: block;
        }

        .notifications-popover {
            width: 340px;
            max-height: 440px;
            overflow-y: auto;
        }

        .popover-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .popover-header h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .text-link {
            font-size: 13px;
            color: var(--primary);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .notification-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 12px;
            cursor: pointer;
            position: relative;
        }

        .notification-item.unread {
            background-color: var(--active-tint);
        }

        .notification-item:hover {
            background-color: var(--bg-hover);
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary);
            position: absolute;
            left: 6px;
            top: 20px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-content strong {
            font-weight: 600;
        }

        .account-popover {
            width: 200px;
            padding: 8px 0;
        }

        .account-menu-item {
            width: 100%;
            padding: 10px 16px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .account-menu-item:hover {
            background-color: var(--bg-hover);
        }

        /* Search Dropdown */
        .search-results-card {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            z-index: 120;
            max-height: 360px;
            overflow-y: auto;
            display: none;
        }

        .search-result-row {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .search-result-row:last-child {
            border-bottom: none;
        }

        .search-result-row:hover, .search-result-row.selected {
            background-color: var(--bg-hover);
        }

        /* ==========================================================================
           Layout Grid
           ========================================================================== */
        .main-layout {
            display: grid;
            grid-template-columns: clamp(224px, 20vw, 320px) minmax(0, 1fr) clamp(288px, 26vw, 400px);
            gap: 24px;
            padding: 24px;
            width: 100%;
            flex: 1;
            align-items: start;
        }

        .sidebar-sticky {
            position: sticky;
            top: calc(var(--header-height) + 24px);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 24px;
        }

        /* ==========================================================================
           Left Navigation Sidebar
           ========================================================================== */
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
        }

        .nav-item-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
        }

        .nav-item-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-item-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .nav-item-btn[aria-current="page"] {
            background-color: var(--active-tint);
            color: var(--primary);
        }

        .nav-badge {
            background-color: var(--destructive);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
        }

        /* ==========================================================================
           Right Sidebar Cards
           ========================================================================== */
        .sidebar-heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .events-list-compact {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-row-compact {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .event-row-compact:last-child {
            border-bottom: none;
        }

        .event-row-compact:hover .event-compact-title {
            color: var(--primary);
        }

        .date-block-48 {
            width: 48px;
            height: 48px;
            background-color: var(--active-tint);
            border-radius: var(--radius-ctrl);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .date-block-48 .day-num {
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            color: var(--primary);
        }

        .date-block-48 .month-abbr {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--primary);
            margin-top: 2px;
        }

        .event-compact-info {
            flex: 1;
            min-width: 0;
        }

        .event-compact-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Calendar Preview */
        .calendar-preview-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 12px;
        }

        .cal-preview-day-header {
            font-weight: 600;
            color: var(--text-secondary);
            padding: 4px 0;
        }

        .cal-preview-cell {
            padding: 6px 0;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-primary);
        }

        .cal-preview-cell.empty {
            cursor: default;
            color: transparent;
        }

        .cal-preview-cell.has-event {
            background-color: var(--active-tint);
            color: var(--primary);
            font-weight: 700;
        }

        .cal-preview-cell.today {
            outline: 1px solid var(--primary);
        }

        /* Online Now */
        .online-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .online-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 4px 0;
        }

        .online-row:hover .online-name {
            color: var(--primary);
        }

        .online-row-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .online-name {
            font-size: 14px;
            font-weight: 600;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--moss);
            flex-shrink: 0;
        }

        /* ==========================================================================
           Center Content Feed & Common Elements
           ========================================================================= */
        .center-feed {
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-width: 0;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-ctrl);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--surface-card);
            border-color: var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--bg-hover);
        }

        .btn-destructive {
            background-color: var(--destructive);
            color: #FFFFFF;
        }

        .btn-destructive:hover {
            opacity: 0.9;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 13px;
        }

        /* Form Controls */
        input[type="text"], input[type="date"], input[type="time"], textarea, select {
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-ctrl);
            padding: 10px 14px;
            width: 100%;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* Toggle Switch (40x24px pill) */
        .switch-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
        }

        .toggle-switch {
            width: 40px;
            height: 24px;
            border-radius: var(--radius-pill);
            background-color: #8F9488;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .toggle-switch[aria-pressed="true"], .toggle-switch.active {
            background-color: var(--primary);
        }

        .toggle-knob {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #FFFFFF;
            position: absolute;
            top: 3px;
            left: 3px;
        }

        .toggle-switch[aria-pressed="true"] .toggle-knob, .toggle-switch.active .toggle-knob {
            left: 19px;
        }

        /* Chips & Pills */
        .chip-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border);
            background: var(--surface-card);
            cursor: pointer;
        }

        .chip-pill.active {
            background-color: var(--active-tint);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Status Badges */
        .status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }

        .status-badge.lost {
            background-color: var(--label-lost-bg);
            color: var(--label-lost-text);
        }

        .status-badge.found {
            background-color: var(--label-found-bg);
            color: var(--label-found-text);
        }

        .status-badge.solved {
            background-color: var(--label-solved-bg);
            color: var(--label-solved-text);
        }

        /* ==========================================================================
           Composer Card
           ========================================================================== */
        .composer-collapsed {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .composer-fake-input {
            flex: 1;
            padding: 10px 16px;
            background-color: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-ctrl);
            color: var(--text-secondary);
            font-size: 15px;
            text-align: left;
            cursor: pointer;
        }

        .composer-expanded {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .composer-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .composer-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .composer-inset-panel {
            background-color: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-ctrl);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .segmented-controls {
            display: inline-flex;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 2px;
            align-self: flex-start;
        }

        .segment-btn {
            border: none;
            background: transparent;
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .segment-btn.active {
            background-color: var(--active-tint);
            color: var(--primary);
        }

        .poll-options-builder {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .poll-option-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .composer-toggles-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .composer-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .composer-actions-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .composer-error {
            color: var(--destructive);
            font-size: 13px;
            font-weight: 600;
        }

        .image-preview-thumbnail-wrap {
            position: relative;
            display: inline-block;
            margin-top: 8px;
        }

        .image-preview-thumbnail {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-ctrl);
            object-fit: cover;
            border: 1px solid var(--border);
            display: block;
        }

        /* ==========================================================================
           Post Card
           ========================================================================== */
        .post-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
        }

        .post-author-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-text {
            display: flex;
            flex-direction: column;
        }

        .author-name-btn {
            background: none;
            border: none;
            padding: 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
        }

        .author-name-btn:hover {
            color: var(--primary);
        }

        .post-meta-line {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .post-body {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .post-image-wrap {
            width: 100%;
            max-height: 420px;
            overflow: hidden;
            border-radius: var(--radius-ctrl);
            border: 1px solid var(--border);
        }

        .post-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .post-lf-details {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            align-items: center;
        }

        .post-lf-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Poll Block */
        .poll-block {
            border: 1px solid var(--border);
            border-radius: var(--radius-ctrl);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--surface-card);
        }

        .poll-question-title {
            font-weight: 600;
            font-size: 15px;
        }

        .poll-options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .poll-voting-option-btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-ctrl);
            border: 1px solid var(--border);
            background: var(--surface-card);
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .poll-voting-option-btn:hover {
            border-color: var(--primary);
            background-color: var(--bg-hover);
        }

        .poll-voting-option-btn.selected {
            border-color: var(--primary);
            background-color: var(--active-tint);
            color: var(--primary);
            font-weight: 600;
        }

        .poll-result-row {
            position: relative;
            border: 1px solid var(--border);
            border-radius: var(--radius-ctrl);
            overflow: hidden;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .poll-result-row.chosen {
            border-color: var(--primary);
            font-weight: 600;
        }

        .poll-progress-bg {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background-color: var(--active-tint);
            z-index: 1;
        }

        .poll-result-text {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .poll-result-stats {
            position: relative;
            z-index: 2;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .poll-result-footer {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Post Action Row */
        .post-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .post-actions-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-ctrl);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .post-action-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .post-action-btn.active {
            background-color: var(--active-tint);
            color: var(--primary);
        }

        /* Post Comments Section */
        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .comment-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .comment-bubble {
            flex: 1;
            background-color: var(--bg-hover);
            padding: 8px 12px;
            border-radius: var(--radius-ctrl);
            font-size: 14px;
        }

        .comment-author-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        .comment-author-name {
            font-weight: 600;
            font-size: 13px;
        }

        .comment-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .comment-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        /* Post 3-dot dropdown menu */
        .post-menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-ctrl);
            box-shadow: var(--shadow-card);
            z-index: 50;
            width: 140px;
            display: none;
            overflow: hidden;
        }

        .post-menu-dropdown.open {
            display: block;
        }

        .post-menu-item {
            width: 100%;
            padding: 8px 14px;
            border: none;
            background: transparent;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-menu-item:hover {
            background-color: var(--bg-hover);
        }

        .post-menu-item.danger {
            color: var(--destructive);
        }

        /* Skeleton Cards */
        .skeleton-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .skeleton-bar {
            background-color: var(--border);
            border-radius: 4px;
        }

        /* ==========================================================================
           Empty States (Forest Trail SVG)
           ========================================================================== */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-secondary);
        }

        .empty-state-text {
            font-size: 14px;
            max-width: 320px;
        }

        /* ==========================================================================
           Messages / Chat Page (Two panes)
           ========================================================================== */
        .chat-container-card {
            padding: 0 !important;
            overflow: hidden;
            display: flex;
            height: calc(100vh - var(--header-height) - 48px);
            min-height: 520px;
        }

        .chat-left-pane {
            width: 300px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: var(--surface-card);
        }

        .chat-left-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 16px;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .conversation-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .conversation-row:hover {
            background-color: var(--bg-hover);
        }

        .conversation-row.active {
            background-color: var(--active-tint);
        }

        .conversation-details {
            flex: 1;
            min-width: 0;
        }

        .conversation-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .conversation-name {
            font-size: 14px;
            font-weight: 600;
        }

        .conversation-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .conversation-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-right-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--surface-card);
        }

        .chat-thread-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .thread-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .thread-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .thread-status.online {
            color: var(--moss);
            font-weight: 600;
        }

        .chat-messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background-color: var(--bg-page);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble-row {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .message-bubble-row.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-bubble-row.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: var(--radius-ctrl);
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message-bubble-row.received .msg-bubble {
            background-color: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
        }

        .message-bubble-row.sent .msg-bubble {
            background-color: var(--primary);
            color: #FFFFFF;
            border-bottom-right-radius: 2px;
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .chat-input-bar {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface-card);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ==========================================================================
           Events & Calendar Page
           ========================================================================== */
        .events-page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .calendar-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .cal-nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cal-nav-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Month View Grid */
        .calendar-month-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid var(--border);
            border-left: 1px solid var(--border);
        }

        .cal-header-cell {
            padding: 10px 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-hover);
        }

        .cal-day-cell {
            min-height: 104px;
            padding: 8px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            background-color: var(--surface-card);
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        .cal-day-cell.other-month {
            background-color: var(--bg-hover);
            cursor: default;
        }

        .cal-day-cell.selected {
            background-color: var(--active-tint);
        }

        .cal-day-cell-top {
            display: flex;
            justify-content: flex-start;
        }

        .cal-day-number {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        .cal-day-cell.today .cal-day-number {
            background-color: var(--primary);
            color: #FFFFFF;
        }

        .cal-event-chip {
            background-color: var(--active-tint);
            border-left: 3px solid var(--primary);
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        /* Week View Grid */
        .calendar-week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid var(--border);
            border-left: 1px solid var(--border);
        }

        .cal-week-col {
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            min-height: 240px;
            display: flex;
            flex-direction: column;
        }

        .cal-week-col-header {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-hover);
            font-size: 13px;
        }

        .cal-week-col-header .weekday-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .cal-week-col-body {
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }

        /* ==========================================================================
           Profiles Page
           ========================================================================== */
        .profile-card-header {
            display: flex;
            align-items: flex-start;
            gap: 24px;
        }

        .profile-card-details {
            flex: 1;
        }

        .profile-display-name {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-meta-line {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 4px 0 12px 0;
        }

        .profile-bio {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* ==========================================================================
           Modals (<dialog>)
           ========================================================================== */
        dialog {
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            background-color: var(--surface-card);
            padding: 0;
            max-width: 520px;
            width: calc(100% - 32px);
            margin: auto;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4);
        }

        .dialog-inner {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dialog-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .dialog-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* ==========================================================================
           Toast Notification
           ========================================================================== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #30352D;
            color: #FFFFFF;
            padding: 10px 20px;
            border-radius: var(--radius-ctrl);
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: none;
            text-align: center;
        }

        /* ==========================================================================
           Responsive Mobile Bottom Navigation (< 820px)
           ========================================================================== */
        .bottom-nav-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--surface-card);
            border-top: 1px solid var(--border);
            z-index: 100;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .bottom-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .bottom-nav-btn[aria-current="page"], .bottom-nav-btn.active {
            color: var(--primary);
            background-color: var(--active-tint);
        }

        /* Responsive Breakpoints */
        @media (max-width: 1100px) {
            .main-layout {
                grid-template-columns: clamp(208px, 26vw, 260px) minmax(0, 1fr);
            }
            .sidebar-right {
                display: none;
            }
        }

        @media (max-width: 820px) {
            header.site-header {
                padding: 0 16px;
            }
            .logo-title {
                display: none;
            }
            .header-search {
                margin: 0 12px;
            }
            .main-layout {
                grid-template-columns: 1fr;
                padding: 16px;
                padding-bottom: 80px;
            }
            .sidebar-left, .sidebar-right {
                display: none;
            }
            .bottom-nav-bar {
                display: flex;
            }
            .card {
                padding: 16px;
            }
            .post-action-btn .btn-text {
                display: none;
            }
            .toast {
                bottom: 74px;
            }
            .calendar-week-grid {
                grid-template-columns: 1fr;
            }
            .chat-container-card {
                height: calc(100vh - var(--header-height) - 100px);
            }
            .chat-left-pane.mobile-hidden {
                display: none;
            }
            .chat-right-pane.mobile-hidden {
                display: none;
            }
            .mobile-back-chat-btn {
                display: inline-flex !important;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================================================
         Top Header
         ======================================================================== -->
    <header class="site-header" role="banner">
        <div class="header-left" onclick="navigateTo('home')" aria-label="Go to Community Feed">
            <div class="logo-box" aria-hidden="true">
                <!-- 20px Chat Bubble SVG -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <div class="logo-title">BRACU Social</div>
        </div>

        <div class="header-search">
            <div class="search-field-wrap">
                <!-- 20px Search Outline SVG -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="global-search-input" placeholder="Search students by name or username" autocomplete="off" aria-label="Search students by name or username">
            </div>
            <!-- Search Results Dropdown -->
            <div class="search-results-card" id="search-results-box" role="listbox"></div>
        </div>

        <div class="header-right">
            <!-- Notifications Bell -->
            <button class="icon-btn" id="notif-bell-btn" aria-label="Notifications" onclick="togglePopover('notif-popover')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="badge-pill" id="header-notif-badge">3</span>
            </button>

            <!-- Notifications Popover Card -->
            <div class="popover-menu notifications-popover" id="notif-popover">
                <div class="popover-header">
                    <h3>Notifications</h3>
                    <button class="text-link" onclick="markAllNotificationsAsRead()">Mark all as read</button>
                </div>
                <div id="notif-list-container"></div>
            </div>

            <!-- Profile Avatar Button -->
            <button class="avatar-btn" id="account-avatar-btn" aria-label="Account menu" onclick="togglePopover('account-popover')">
                <div class="avatar sm" style="background-color: #526747;">R</div>
            </button>

            <!-- Account Menu Popover -->
            <div class="popover-menu account-popover" id="account-popover">
                <button class="account-menu-item" onclick="navigateTo('profile', 'rafi'); closeAllPopovers();">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    My Profile
                </button>
                <button class="account-menu-item" onclick="navigateTo('messages'); closeAllPopovers();">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </button>
            </div>
        </div>
    </header>

    <!-- ========================================================================
         Main Layout
         ======================================================================== -->
    <main class="main-layout" role="main">
        <!-- Left Sidebar (Single White Card) -->
        <aside class="sidebar-left" aria-label="Main Navigation">
            <div class="sidebar-sticky">
                <div class="card" style="padding: 16px;">
                    <ul class="nav-list" role="list">
                        <li>
                            <button class="nav-item-btn" id="nav-home" onclick="navigateTo('home')" aria-current="page">
                                <div class="nav-item-left">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                                    <span>Home</span>
                                </div>
                            </button>
                        </li>
                        <li>
                            <button class="nav-item-btn" id="nav-messages" onclick="navigateTo('messages')">
                                <div class="nav-item-left">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                    <span>Messages</span>
                                </div>
                                <span class="nav-badge" id="nav-unread-count">1</span>
                            </button>
                        </li>
                        <li>
                            <button class="nav-item-btn" id="nav-events" onclick="navigateTo('events')">
                                <div class="nav-item-left">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                    <span>Events & Calendar</span>
                                </div>
                            </button>

                <path d="M0 48 Q45 28 90 42 Q110 46 120 52 L120 72 L0 72 Z" fill="#D5DEC8" />
                <!-- Front hill (sage green) -->
                <path d="M0 58 Q35 44 80 52 Q105 56 120 64 L120 72 L0 72 Z" fill="#91A77C" />
                <!-- Four forest-green triangle trees -->
                <polygon points="24,30 18,48 30,48" fill="#526747" />
                <polygon points="36,24 28,45 44,45" fill="#526747" />
                <polygon points="76,28 70,47 82,47" fill="#526747" />

                <!-- Warm ivory trail -->

        function renderAvatar(user, sizeClass = '') {
            if (!user) {
                return `<div class="avatar ${sizeClass}" style="background-color: #59635C;">?</div>`;
            }
            return `<div class="avatar ${sizeClass}" style="background-color: ${user.avatarColor};">${user.avatarLetter}</div>`;
        }

        /* --------------------------------------------------------------------------
           4. Global UI Navigation & Page Routing
           -------------------------------------------------------------------------- */
        function navigateTo(page, param = null) {
            currentPage = page;
            if (page === 'profile' && param) {
                currentProfileUserId = param;
            }
            if (page === 'messages' && param) {
                activeChatUserId = param;
            }

            // Update Left Nav active states
            ['home', 'messages', 'events', 'lostfound', 'polls', 'profile'].forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                const bbtn = document.getElementById(`bnav-${id}`);
                const isActive = (id === page) || (id === 'profile' && page === 'profile' && currentProfileUserId === CURRENT_USER_ID);
                if (btn) {
                    if (isActive) btn.setAttribute('aria-current', 'page');
                    else btn.removeAttribute('aria-current');
                }
                if (bbtn) {
                    if (isActive) {
                        bbtn.setAttribute('aria-current', 'page');
                        bbtn.classList.add('active');
                    } else {
                        bbtn.removeAttribute('aria-current');
                        bbtn.classList.remove('active');
                    }
                }
            });

            window.scrollTo({ top: 0, behavior: 'instant' });
            renderCurrentPage();
            renderSidebarComponents();
        }

        function renderCurrentPage() {
            const container = document.getElementById('page-container');
            if (currentPage === 'home') {
                renderHomePage(container);
            } else if (currentPage === 'polls') {
                renderPollsPage(container);
            } else if (currentPage === 'lostfound') {
                renderLostFoundPage(container);
            } else if (currentPage === 'profile') {
                renderProfilePage(container, currentProfileUserId);
            } else if (currentPage === 'messages') {
                renderMessagesPage(container);
            } else if (currentPage === 'events') {
                renderEventsPage(container);
            }
        }

        /* --------------------------------------------------------------------------
           5. Home Page & Composer Logic
           -------------------------------------------------------------------------- */
        let hasShownInitialSkeleton = false;

        function renderHomePage(container) {
            container.innerHTML = `

                    <h1>Community Feed</h1>

                    ${renderComposerHTML()}

                <div id="posts-list-container" style="display: flex; flex-direction: column; gap: 24px;">
                    ${hasShownInitialSkeleton ? renderPostsHTML(POSTS) : renderSkeletonHTML()}

            if (!hasShownInitialSkeleton) {
                setTimeout(() => {
                    hasShownInitialSkeleton = true;

        function renderComposerHTML() {

            if (!composerState.expanded) {
                return `
                    <div class="composer-collapsed" onclick="expandComposer()">

                        <button class="composer-fake-input" type="button">Share something with your community…</button>

            }

            return `
                <div class="composer-expanded">
                    <div class="composer-header-row">
                        <div class="composer-user-info">
                            ${renderAvatar(composerState.anonymous ? null : me)}
                            <div>
                                <span style="font-weight: 600;">Create a post</span>

                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>

                    <!-- Title & Body -->
                    <input type="text" id="composer-title" placeholder="Title (optional if adding poll)" aria-label="Post title">
                    <textarea id="composer-body" rows="3" placeholder="What's on your mind?" aria-label="Post body"></textarea>

                    <!-- Image Attachment Controls -->
                    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <label class="btn btn-secondary btn-sm" style="cursor: pointer;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                Add image
                                <input type="file" id="composer-image-file" accept="image/*" style="display: none;" onchange="handleComposerImageUpload(event)">
                            </label>
                            ${composerState.image ? `<button class="btn btn-secondary btn-sm" onclick="removeComposerImage()">Remove image</button>` : ''}
                        </div>
                        ${composerState.image ? `
                            <div class="image-preview-thumbnail-wrap">
                                <img src="${composerState.image}" alt="Preview" class="image-preview-thumbnail">
                            </div>

                    </div>

                    <!-- Feature Toggles Chips -->
                    <div class="composer-toggles-row">

                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
                            Poll
                        </button>
                        <button class="chip-pill ${composerState.lfActive ? 'active' : ''}" type="button" onclick="toggleComposerSection('lf')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            Lost & Found
                        </button>
                    </div>

                    <!-- Optional Lost & Found Inset Panel -->
                    ${composerState.lfActive ? `
                        <div class="composer-inset-panel">
                            <div style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Lost & Found Item Details</div>
                            <div class="segmented-controls">
                                <button class="segment-btn ${composerState.lfStatus === 'Lost' ? 'active' : ''}" onclick="setComposerLfStatus('Lost')">Lost</button>
                                <button class="segment-btn ${composerState.lfStatus === 'Found' ? 'active' : ''}" onclick="setComposerLfStatus('Found')">Found</button>
                            </div>
                            <input type="text" id="composer-lf-location" placeholder="Location (e.g. UB2 Canteen, Library 3rd floor)">
                            <input type="text" id="composer-lf-date" placeholder="Date (e.g. 28 Oct 2026)">
                        </div>
                    ` : ''}

                    <!-- Optional Poll Inset Panel -->
                    ${composerState.pollActive ? `
                        <div class="composer-inset-panel">
                            <div style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">Poll Configuration</div>
                            <input type="text" id="composer-poll-question" placeholder="Poll question (e.g. What day works best?)">
                            
                            <div class="poll-options-builder" id="composer-poll-options">
                                ${composerState.pollOptions.map((opt, idx) => `
                                    <div class="poll-option-input-row">
                                        <input type="text" value="${opt}" placeholder="Option ${idx + 1}" oninput="updateComposerPollOption(${idx}, this.value)">
                                        ${composerState.pollOptions.length > 2 ? `
                                            <button class="icon-btn" style="width: 32px; height: 32px;" onclick="removeComposerPollOption(${idx})" aria-label="Remove option">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                            </button>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                            
                            ${composerState.pollOptions.length < 6 ? `
                                <div>
                                    <button class="btn btn-secondary btn-sm" type="button" onclick="addComposerPollOption()">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                        Add option
                                    </button>
                                </div>
                            ` : ''}

                            <div style="margin-top: 4px;">
                                <label class="switch-wrap">
                                    <button type="button" role="switch" class="toggle-switch ${composerState.pollMultiple ? 'active' : ''}" aria-checked="${composerState.pollMultiple}" onclick="toggleComposerPollMultiple()">
                                        <span class="toggle-knob"></span>
                                    </button>
                                    <span>Allow multiple choices</span>
                                </label>
                            </div>
                        </div>
                    ` : ''}

                    <div class="composer-footer-row">
                        <label class="switch-wrap">

                                <span class="toggle-knob"></span>
                            </button>
                            <span>Post anonymously</span>
                        </label>

                        <div class="composer-actions-right">
                            <span id="composer-error-text" class="composer-error" role="alert"></span>
