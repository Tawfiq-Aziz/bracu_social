        function expandComposer(opts = {}) {
            composerState.expanded = true;
            if (opts.poll) composerState.pollActive = true;
            if (opts.lostFound) composerState.lfActive = true;
            const card = document.getElementById('composer-card');
            if (card) card.innerHTML = renderComposerHTML();
        }

        function collapseComposer() {
            composerState.expanded = false;
            composerState.pollActive = false;
            composerState.lfActive = false;
            composerState.anonymous = false;
            composerState.image = null;
            composerState.pollOptions = ["", ""];
            const card = document.getElementById('composer-card');
            if (card) card.innerHTML = renderComposerHTML();
        }

        function toggleComposerSection(sec) {
            if (sec === 'poll') composerState.pollActive = !composerState.pollActive;
            if (sec === 'lf') composerState.lfActive = !composerState.lfActive;
            const card = document.getElementById('composer-card');
            if (card) card.innerHTML = renderComposerHTML();
        }

        function setComposerLfStatus(status) {
            composerState.lfStatus = status;
            const card = document.getElementById('composer-card');
            if (card) card.innerHTML = renderComposerHTML();
        }

        function toggleComposerAnonymous() {
            composerState.anonymous = !composerState.anonymous;
            const card = document.getElementById('composer-card');
            if (card) card.innerHTML = renderComposerHTML();
        }

        function toggleComposerPollMultiple() {
            composerState.pollMultiple = !composerState.pollMultiple;
            const card = document.getElementById('composer-card');
            if (card) card.innerHTML = renderComposerHTML();
        }

        function addComposerPollOption() {
            if (composerState.pollOptions.length < 6) {
                composerState.pollOptions.push("");
                const card = document.getElementById('composer-card');
                if (card) card.innerHTML = renderComposerHTML();
            }
        }

        function removeComposerPollOption(index) {
            if (composerState.pollOptions.length > 2) {
                composerState.pollOptions.splice(index, 1);
                const card = document.getElementById('composer-card');
                if (card) card.innerHTML = renderComposerHTML();
            }
        }

        function updateComposerPollOption(index, val) {
            composerState.pollOptions[index] = val;
        }

        function handleComposerImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    composerState.image = e.target.result;
                    const card = document.getElementById('composer-card');
                    if (card) card.innerHTML = renderComposerHTML();
                };
                reader.readAsDataURL(file);
            }
        }

        function removeComposerImage() {
            composerState.image = null;
            const card = document.getElementById('composer-card');
            if (card) card.innerHTML = renderComposerHTML();
        }

        function publishPost() {
            const titleInput = document.getElementById('composer-title');
            const bodyInput = document.getElementById('composer-body');
            const errorElem = document.getElementById('composer-error-text');
            const publishBtn = document.getElementById('composer-publish-btn');

            const title = titleInput ? titleInput.value.trim() : '';
            const body = bodyInput ? bodyInput.value.trim() : '';

            // Validation rules
            if (!composerState.pollActive && !title) {
                errorElem.textContent = "Add a title.";
                return;
            }
            if (!body && !composerState.image && !composerState.pollActive) {
                errorElem.textContent = "Add some text or an image.";
                return;
            }

            let pollData = null;
            if (composerState.pollActive) {
                const qInput = document.getElementById('composer-poll-question');
                const question = qInput ? qInput.value.trim() : '';
                if (!question) {
                    errorElem.textContent = "Add a poll question.";
                    return;
                }
                const validOptions = composerState.pollOptions.map(o => o.trim()).filter(o => o.length > 0);
                if (validOptions.length < 2) {
                    errorElem.textContent = "Add at least two poll options.";
                    return;
                }
                pollData = {
                    question: question,
                    multiple: composerState.pollMultiple,
                    options: validOptions.map((opt, i) => ({ id: `opt-${Date.now()}-${i}`, text: opt, votes: 0 })),
                    userVotedOptionIds: []
                };
            }

            let lfData = null;
            if (composerState.lfActive) {
                const locInput = document.getElementById('composer-lf-location');
                const dateInput = document.getElementById('composer-lf-date');
                lfData = {
                    status: composerState.lfStatus,
                    location: locInput ? (locInput.value.trim() || 'Campus') : 'Campus',
                    date: dateInput ? (dateInput.value.trim() || '28 Oct 2026') : '28 Oct 2026',
                    resolved: false
                };
            }

            errorElem.textContent = "";
            publishBtn.textContent = "Publishing…";
            publishBtn.disabled = true;

            setTimeout(() => {
                const newPost = {
                    id: `post-${Date.now()}`,
                    authorId: CURRENT_USER_ID,
                    anonymous: composerState.anonymous,
                    timestamp: "Just now",
                    title: title || null,
                    body: body,
                    image: composerState.image,
                    lostFound: lfData,
                    poll: pollData,
                    likes: [],
                    dislikes: [],
                    comments: []
                };

                POSTS.unshift(newPost);
                collapseComposer();
                showToast("Post published");
                renderCurrentPage();
            }, 600);
        }

        /* --------------------------------------------------------------------------
           6. Post Cards Rendering & Feed Items
           -------------------------------------------------------------------------- */
        function renderPostsHTML(posts) {
            if (!posts || posts.length === 0) {
                return `
                    <div class="card empty-state">
                        ${getForestIllustration()}
                        <div class="empty-state-text">No posts yet. Be the first to share something.</div>
                    </div>
                `;
            }

            return posts.map(post => renderSinglePostCard(post)).join('');
        }

        function renderSinglePostCard(post) {
            const author = USERS[post.authorId];
            const isOwner = (post.authorId === CURRENT_USER_ID);
            const isLiked = post.likes.includes(CURRENT_USER_ID);
            const isDisliked = post.dislikes.includes(CURRENT_USER_ID);

            // Badges
            let statusChip = '';
            if (post.lostFound) {
                if (post.lostFound.resolved) {
                    statusChip = `<span class="status-badge solved">Solved</span>`;
                } else if (post.lostFound.status === 'Lost') {
                    statusChip = `<span class="status-badge lost">Lost</span>`;
                } else {
                    statusChip = `<span class="status-badge found">Found</span>`;
                }
            }

            // Author Header display
            let authorNameText = post.anonymous ? 'Anonymous' : (author ? author.name : 'BRACU Student');
            let authorSubline = `${post.timestamp} · ${post.anonymous ? 'Student' : (author ? author.department : 'Campus')}`;
            if (post.anonymous && isOwner) {
                authorSubline += ' · only you can see this is yours';
            }

            return `
                <article class="card post-card" id="card-${post.id}">
                    <div class="post-header-row">
                        <div class="post-author-wrap">
                            <div onclick="${post.anonymous ? '' : `navigateTo('profile', '${post.authorId}')`}" style="cursor: ${post.anonymous ? 'default' : 'pointer'};">
                                ${renderAvatar(post.anonymous ? null : author)}
                            </div>
                            <div class="author-text">
                                <button class="author-name-btn" onclick="${post.anonymous ? '' : `navigateTo('profile', '${post.authorId}')`}" style="cursor: ${post.anonymous ? 'default' : 'pointer'};">
                                    ${authorNameText}
                                </button>
                                <span class="post-meta-line">${authorSubline}</span>
                            </div>
                        </div>

                        <div style="display: flex; align-items: center; gap: 8px;">
                            ${statusChip}
                            ${isOwner ? `
                                <div style="position: relative;">
                                    <button class="icon-btn" onclick="togglePostMenu('${post.id}')" aria-label="Post options">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                                    </button>
                                    <div class="post-menu-dropdown" id="post-menu-${post.id}">
                                        <button class="post-menu-item" onclick="openEditPostDialog('${post.id}')">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                                            Edit post
                                        </button>
                                        <button class="post-menu-item danger" onclick="openDeletePostDialog('${post.id}')">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                            Delete post
                                        </button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    ${post.title ? `<h3 class="post-title">${post.title}</h3>` : ''}
                    ${post.body ? `<div class="post-body">${post.body}</div>` : ''}

                    ${post.lostFound ? `
                        <div class="post-lf-details">
                            <span class="post-lf-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                ${post.lostFound.location}
                            </span>
                            <span class="post-lf-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                ${post.lostFound.date}
                            </span>
                        </div>
                    ` : ''}

                    ${post.image ? `
                        <div class="post-image-wrap">
                            <img src="${post.image}" alt="Post image attachment">
                        </div>
                    ` : ''}

                    ${post.poll ? renderPollBlock(post) : ''}

                    <!-- Post Action Row -->
                    <div class="post-action-row">
                        <div class="post-actions-left">
                            <button class="post-action-btn ${isLiked ? 'active' : ''}" onclick="toggleLikePost('${post.id}')" aria-label="Like post">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <span>${post.likes.length}</span>
                                <span class="btn-text">${post.likes.length === 1 ? 'Like' : 'Likes'}</span>
                            </button>
                            <button class="post-action-btn ${isDisliked ? 'active' : ''}" onclick="toggleDislikePost('${post.id}')" aria-label="Dislike post">

                                <span>${post.dislikes.length}</span>
                            </button>
                            <button class="post-action-btn" onclick="toggleCommentsSection('${post.id}')" aria-label="View comments">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                <span>${post.comments.length}</span>
                                <span class="btn-text">Comments</span>
                            </button>
                        </div>

                        ${isOwner && post.lostFound ? `
                            <label class="switch-wrap">
                                <span class="btn-text">Mark as solved</span>
                                <button type="button" role="switch" class="toggle-switch ${post.lostFound.resolved ? 'active' : ''}" aria-checked="${post.lostFound.resolved}" onclick="togglePostSolved('${post.id}')">
                                    <span class="toggle-knob"></span>
                                </button>
                            </label>
                        ` : ''}
                    </div>

                    <!-- Comments Section -->
                    <div class="comments-section" id="comments-${post.id}">
                        ${post.comments.map(c => {
                            const cAuthor = USERS[c.authorId];
                            return `
                                <div class="comment-item">
                                    ${renderAvatar(cAuthor, 'sm')}
                                    <div class="comment-bubble">
                                        <div class="comment-author-line">
                                            <span class="comment-author-name">${cAuthor ? cAuthor.name : 'Student'}</span>
                                            <span class="comment-time">${c.timestamp}</span>
                                        </div>
                                        <div>${c.text}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}

                        <!-- Comment input row -->
                        <div class="comment-input-row">
                            ${renderAvatar(USERS[CURRENT_USER_ID], 'sm')}
                            <input type="text" id="comment-input-${post.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter') submitComment('${post.id}')">
                            <button class="btn btn-primary btn-sm" onclick="submitComment('${post.id}')">Post</button>
                        </div>
                    </div>
                </article>
            `;
        }

        /* --------------------------------------------------------------------------
           7. Polls Voting & Results
           -------------------------------------------------------------------------- */
        let pollDraftSelections = {}; // { postId: [optId, ...] } for multiple choice polls before submit

        function renderPollBlock(post) {
            const poll = post.poll;
            const hasVoted = poll.userVotedOptionIds && poll.userVotedOptionIds.length > 0;
            const totalVotes = poll.options.reduce((sum, o) => sum + o.votes, 0);

            if (hasVoted) {
                // Show Results View
                return `
                    <div class="poll-block">
                        <div class="poll-question-title">${poll.question}</div>
                        <div class="poll-options-list">
                            ${poll.options.map(opt => {
                                const isUserChoice = poll.userVotedOptionIds.includes(opt.id);
                                const pct = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
                                return `
                                    <div class="poll-result-row ${isUserChoice ? 'chosen' : ''}">
                                        <div class="poll-progress-bg" style="width: ${pct}%;"></div>
                                        <div class="poll-result-text">
                                            ${isUserChoice ? `
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                            ` : ''}
                                            <span>${opt.text}</span>
                                        </div>
                                        <div class="poll-result-stats">${pct}% · ${opt.votes}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="poll-result-footer">
                            You voted · ${totalVotes} ${totalVotes === 1 ? 'vote' : 'votes'}
                        </div>
                    </div>
                `;
            }

            // Voting Interface
            if (!poll.multiple) {
                // Single Choice: Click immediately records vote
                return `
                    <div class="poll-block">
                        <div class="poll-question-title">${poll.question}</div>
                        <div class="poll-options-list">
                            ${poll.options.map(opt => `
                                <button class="poll-voting-option-btn" onclick="castPollVoteSingle('${post.id}', '${opt.id}')">
                                    <span>${opt.text}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div class="text-muted">Select one choice to vote.</div>
                    </div>
                `;
            }

            // Multiple Choice: Toggle options and submit vote
            const currentDraft = pollDraftSelections[post.id] || [];
            return `
                <div class="poll-block">
                    <div class="poll-question-title">${poll.question}</div>
                    <div class="poll-options-list">
                        ${poll.options.map(opt => {
                            const isSelected = currentDraft.includes(opt.id);
                            return `
                                <button class="poll-voting-option-btn ${isSelected ? 'selected' : ''}" onclick="togglePollDraftOption('${post.id}', '${opt.id}')">
                                    <span>${opt.text}</span>
                                    ${isSelected ? `
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    ` : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
                        <span class="text-muted">Select multiple options</span>
                        <button class="btn btn-primary btn-sm" onclick="submitPollVoteMultiple('${post.id}')">Submit vote</button>
                    </div>
                </div>
            `;
        }

        function castPollVoteSingle(postId, optionId) {
            const post = POSTS.find(p => p.id === postId);
            if (!post || !post.poll) return;

            const opt = post.poll.options.find(o => o.id === optionId);
            if (opt) {
                opt.votes += 1;
                post.poll.userVotedOptionIds = [optionId];
                showToast("Vote recorded");
                renderCurrentPage();
            }
        }

        function togglePollDraftOption(postId, optionId) {
            if (!pollDraftSelections[postId]) pollDraftSelections[postId] = [];
            const list = pollDraftSelections[postId];
            const idx = list.indexOf(optionId);
            if (idx > -1) list.splice(idx, 1);
            else list.push(optionId);
            renderCurrentPage();
        }

        function submitPollVoteMultiple(postId) {
            const post = POSTS.find(p => p.id === postId);
            if (!post || !post.poll) return;

            const drafted = pollDraftSelections[postId] || [];
            if (drafted.length === 0) {
                showToast("Select at least one option");
                return;
            }

            drafted.forEach(optId => {
                const opt = post.poll.options.find(o => o.id === optId);
                if (opt) opt.votes += 1;
            });

            post.poll.userVotedOptionIds = drafted;
            delete pollDraftSelections[postId];
            showToast("Vote recorded");
            renderCurrentPage();
        }

        /* --------------------------------------------------------------------------
           8. Interactions (Likes, Comments, Solved, Menus)
           -------------------------------------------------------------------------- */
        function toggleLikePost(postId) {
            const post = POSTS.find(p => p.id === postId);
            if (!post) return;

            const lIndex = post.likes.indexOf(CURRENT_USER_ID);
            const dIndex = post.dislikes.indexOf(CURRENT_USER_ID);

            if (lIndex > -1) {
                post.likes.splice(lIndex, 1);
            } else {
                post.likes.push(CURRENT_USER_ID);
                if (dIndex > -1) post.dislikes.splice(dIndex, 1);
            }
            renderCurrentPage();
        }

        function toggleDislikePost(postId) {
            const post = POSTS.find(p => p.id === postId);
            if (!post) return;

            const lIndex = post.likes.indexOf(CURRENT_USER_ID);
            const dIndex = post.dislikes.indexOf(CURRENT_USER_ID);

            if (dIndex > -1) {
                post.dislikes.splice(dIndex, 1);
            } else {
                post.dislikes.push(CURRENT_USER_ID);
                if (lIndex > -1) post.likes.splice(lIndex, 1);
            }
            renderCurrentPage();
        }

        function toggleCommentsSection(postId) {
            const sec = document.getElementById(`comments-${postId}`);
            if (sec) {
                sec.style.display = (sec.style.display === 'none') ? 'flex' : 'none';
            }
        }

        function submitComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input) return;

            const text = input.value.trim();
            if (!text) {
                showToast("Write a comment first");
                return;
            }

            const post = POSTS.find(p => p.id === postId);
            if (post) {
                post.comments.push({
                    id: `c-${Date.now()}`,
                    authorId: CURRENT_USER_ID,
                    timestamp: "Just now",
                    text: text
                });
                showToast("Comment added");
                renderCurrentPage();
            }
        }

        function togglePostSolved(postId) {
            const post = POSTS.find(p => p.id === postId);
            if (post && post.lostFound) {
                post.lostFound.resolved = !post.lostFound.resolved;
                if (post.lostFound.resolved) {
                    showToast("Marked as solved");
                } else {
                    showToast("Reopened as unresolved");
                }
                renderCurrentPage();
            }
        }

        function togglePostMenu(postId) {
            const menu = document.getElementById(`post-menu-${postId}`);
            if (!menu) return;
            const isOpen = menu.classList.contains('open');
            closeAllPostMenus();
            if (!isOpen) menu.classList.add('open');
        }

        function closeAllPostMenus() {
            document.querySelectorAll('.post-menu-dropdown').forEach(m => m.classList.remove('open'));
        }

        /* --------------------------------------------------------------------------
           9. Edit & Delete Dialog Logic
           -------------------------------------------------------------------------- */
        function openEditPostDialog(postId) {
            closeAllPostMenus();
            const post = POSTS.find(p => p.id === postId);
            if (!post) return;

            editingPostId = postId;
            document.getElementById('edit-post-title').value = post.title || '';
            document.getElementById('edit-post-body').value = post.body || '';

            const imgWrap = document.getElementById('edit-image-container');
            const imgPreview = document.getElementById('edit-image-preview');
            if (post.image) {
                imgWrap.style.display = 'block';
                imgPreview.src = post.image;
            } else {
                imgWrap.style.display = 'none';
                imgPreview.src = '';
            }

            const lfWrap = document.getElementById('edit-lf-container');
            if (post.lostFound) {
                lfWrap.style.display = 'flex';
                document.getElementById('edit-lf-status').value = post.lostFound.status;
                document.getElementById('edit-lf-location').value = post.lostFound.location;
                document.getElementById('edit-lf-date').value = post.lostFound.date;
            } else {
                lfWrap.style.display = 'none';
            }

            const pollWrap = document.getElementById('edit-poll-container');
            if (post.poll) {
                pollWrap.style.display = 'flex';
                document.getElementById('edit-poll-question').value = post.poll.question;
                const optsBox = document.getElementById('edit-poll-options-box');
                optsBox.innerHTML = post.poll.options.map((opt, i) => `
                    <input type="text" class="edit-poll-opt-input" data-opt-id="${opt.id}" value="${opt.text}" placeholder="Option ${i + 1}">
                `).join('');
            } else {
                pollWrap.style.display = 'none';
            }

            document.getElementById('edit-post-dialog').showModal();
        }

        function removeEditImage() {
            const post = POSTS.find(p => p.id === editingPostId);
            if (post) post.image = null;
            document.getElementById('edit-image-container').style.display = 'none';
        }

        function saveEditedPost() {
            const post = POSTS.find(p => p.id === editingPostId);
            if (!post) return;

            post.title = document.getElementById('edit-post-title').value.trim() || null;
            post.body = document.getElementById('edit-post-body').value.trim();

            if (post.lostFound) {
                post.lostFound.status = document.getElementById('edit-lf-status').value;
                post.lostFound.location = document.getElementById('edit-lf-location').value.trim() || post.lostFound.location;
                post.lostFound.date = document.getElementById('edit-lf-date').value.trim() || post.lostFound.date;
            }

            if (post.poll) {
                post.poll.question = document.getElementById('edit-poll-question').value.trim() || post.poll.question;
                document.querySelectorAll('.edit-poll-opt-input').forEach(input => {
                    const optId = input.getAttribute('data-opt-id');
                    const opt = post.poll.options.find(o => o.id === optId);
                    if (opt) opt.text = input.value.trim() || opt.text;
                });
            }

            closeDialog('edit-post-dialog');
            showToast("Post updated");
            renderCurrentPage();
        }

        function openDeletePostDialog(postId) {
            closeAllPostMenus();
            deletingPostId = postId;
            document.getElementById('delete-post-dialog').showModal();
        }

        function confirmDeletePost() {
            if (deletingPostId) {
                POSTS = POSTS.filter(p => p.id !== deletingPostId);
                deletingPostId = null;
                closeDialog('delete-post-dialog');
                showToast("Post deleted");
                renderCurrentPage();
            }
        }

        function closeDialog(dialogId) {
            const d = document.getElementById(dialogId);
            if (d && d.close) d.close();
        }

        /* --------------------------------------------------------------------------
           10. Polls Page
           -------------------------------------------------------------------------- */
        function renderPollsPage(container) {
            const pollPosts = POSTS.filter(p => p.poll !== null);
            container.innerHTML = `
                <div style="display: flex; align-items: flex-start; justify-content: space-between;">
                    <div>
                        <h1>Polls</h1>
                        <div class="page-subtitle">Vote and see what students think.</div>
                    </div>
                    <button class="btn btn-primary" onclick="openCreatePollInFeed()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Create poll
                    </button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 24px;">
                    ${pollPosts.length > 0 ? pollPosts.map(p => renderSinglePostCard(p)).join('') : `
                        <div class="card empty-state">

            setTimeout(() => {
                expandComposer({ poll: true });

        }

        /* --------------------------------------------------------------------------
           11. Lost & Found Page
           -------------------------------------------------------------------------- */
        function renderLostFoundPage(container) {
            const allLfPosts = POSTS.filter(p => p.lostFound !== null);
            const unresolvedCount = allLfPosts.filter(p => !p.lostFound.resolved).length;
            const solvedCount = allLfPosts.filter(p => p.lostFound.resolved).length;

            let filtered = allLfPosts;
            if (activeLfFilter === 'unresolved') {
                filtered = allLfPosts.filter(p => !p.lostFound.resolved);
            } else if (activeLfFilter === 'solved') {
                filtered = allLfPosts.filter(p => p.lostFound.resolved);
            }

            container.innerHTML = `
                <div style="display: flex; align-items: flex-start; justify-content: space-between;">
                    <div>
                        <h1>Lost & Found</h1>
                        <div class="page-subtitle">Help items find their way back to their owners.</div>
                    </div>
                    <button class="btn btn-primary" onclick="openReportItemInFeed()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        Report an item
                    </button>
                </div>

                <!-- Segment Filter Pills -->
                <div style="display: flex; gap: 8px; margin-bottom: 4px;">
                    <button class="chip-pill ${activeLfFilter === 'all' ? 'active' : ''}" onclick="setLfFilter('all')">
                        All (${allLfPosts.length})
                    </button>
                    <button class="chip-pill ${activeLfFilter === 'unresolved' ? 'active' : ''}" onclick="setLfFilter('unresolved')">
                        Unresolved (${unresolvedCount})
                    </button>
                    <button class="chip-pill ${activeLfFilter === 'solved' ? 'active' : ''}" onclick="setLfFilter('solved')">
                        Solved (${solvedCount})
                    </button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 24px;">
                    ${filtered.length > 0 ? filtered.map(p => renderSinglePostCard(p)).join('') : `
                        <div class="card empty-state">
                            ${getForestIllustration()}
                            <div class="empty-state-text">Nothing here yet. Items you report will appear in this list.</div>
                        </div>
                    `}
                </div>
            `;
        }

        function setLfFilter(filter) {
            activeLfFilter = filter;
            renderCurrentPage();
        }

        function openReportItemInFeed() {
            navigateTo('home');
            setTimeout(() => {
                expandComposer({ lostFound: true });
            }, 50);
        }

        /* --------------------------------------------------------------------------

        /* --------------------------------------------------------------------------
           13. Messages / Chat Page (Two-pane desktop, adaptive mobile)
           -------------------------------------------------------------------------- */
        let mobileChatThreadVisible = false;

        function renderMessagesPage(container) {
            const activeUser = USERS[activeChatUserId] || USERS['nusrat'];
            const activeConv = CONVERSATIONS.find(c => c.userId === activeUser.id);
            const messages = activeConv ? activeConv.messages : [];

            container.innerHTML = `
                <div>
                    <h1>Messages</h1>
                    <div class="page-subtitle">Chat with other students.</div>
                </div>

                <div class="card chat-container-card">
                    <!-- Left Pane: Conversation List (300px) -->
                    <div class="chat-left-pane ${mobileChatThreadVisible ? 'mobile-hidden' : ''}">
                        <div class="chat-left-header">Conversations</div>
                        <ul class="conversation-list" role="list">
                            ${CONVERSATIONS.map(conv => {
                                const u = USERS[conv.userId];
                                if (!u) return '';
                                const lastMsg = conv.messages[conv.messages.length - 1];
                                const isSelected = (conv.userId === activeUser.id);
                                return `
                                    <li class="conversation-row ${isSelected ? 'active' : ''}" onclick="selectConversation('${conv.userId}')">
                                        ${renderAvatar(u, 'sm')}
                                        <div class="conversation-details">
                                            <div class="conversation-name-row">
                                                <span class="conversation-name">${u.name}</span>
                                                <span class="conversation-time">${lastMsg ? lastMsg.time : ''}</span>
                                            </div>
                                            <div class="conversation-preview">${lastMsg ? lastMsg.text : 'Say hello.'}</div>
                                        </div>
                                        ${conv.unread > 0 ? `<span class="nav-badge">${conv.unread}</span>` : ''}
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    </div>

                    <!-- Right Pane: Thread View -->
                    <div class="chat-right-pane ${!mobileChatThreadVisible ? 'mobile-hidden' : ''}">
                        <div class="chat-thread-header">
                            <div class="thread-user-info">
                                <button class="icon-btn mobile-back-chat-btn" style="display: none; width: 32px; height: 32px;" onclick="closeMobileChatThread()" aria-label="Back to conversations">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                </button>
                                ${renderAvatar(activeUser, 'sm')}
                                <div>
                                    <div style="font-weight: 600; font-size: 15px;">${activeUser.name}</div>
                                    <div class="thread-status ${activeUser.online ? 'online' : ''}">${activeUser.online ? 'Online' : 'Offline'}</div>
                                </div>
                            </div>
                            <button class="btn btn-secondary btn-sm" onclick="navigateTo('profile', '${activeUser.id}')">View profile</button>
                        </div>

                        <!-- Thread Messages -->
                        <div class="chat-messages-area" id="chat-messages-scroll">
                            ${messages.length === 0 ? `
                                <div class="empty-state" style="margin: auto;">
                                    ${getForestIllustration()}
                                    <div class="empty-state-text">No messages yet. Say hello.</div>
                                </div>
                            ` : messages.map(m => {
                                const isMine = (m.senderId === CURRENT_USER_ID);
                                return `
                                    <div class="message-bubble-row ${isMine ? 'sent' : 'received'}">
                                        <div class="msg-bubble">${m.text}</div>
                                        <span class="msg-time">${m.time}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <!-- Footer Input -->
                        <div class="chat-input-bar">
                            <input type="text" id="chat-send-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                            <button class="btn btn-primary" onclick="sendChatMessage()" aria-label="Send message">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                <span class="btn-text">Send</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Scroll to bottom of message thread
            const scrollArea = document.getElementById('chat-messages-scroll');
            if (scrollArea) scrollArea.scrollTop = scrollArea.scrollHeight;
        }

        function selectConversation(userId) {
            activeChatUserId = userId;
            mobileChatThreadVisible = true;

            const conv = CONVERSATIONS.find(c => c.userId === userId);
            if (conv && conv.unread > 0) {
                conv.unread = 0;
                updateHeaderBadges();
            }

            renderCurrentPage();
        }

        function closeMobileChatThread() {
            mobileChatThreadVisible = false;
            renderCurrentPage();
        }

        function openChatWithUser(userId) {
            let conv = CONVERSATIONS.find(c => c.userId === userId);
            if (!conv) {
                conv = {
                    userId: userId,
                    unread: 0,
                    messages: []
                };
                CONVERSATIONS.unshift(conv);
            }
            activeChatUserId = userId;
            mobileChatThreadVisible = true;
            navigateTo('messages');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-send-input');
            if (!input) return;

            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            let conv = CONVERSATIONS.find(c => c.userId === activeChatUserId);
            if (!conv) {
                conv = { userId: activeChatUserId, unread: 0, messages: [] };
                CONVERSATIONS.unshift(conv);
            }

            // Move to top of conversations list
            const convIdx = CONVERSATIONS.indexOf(conv);
            if (convIdx > 0) {
                CONVERSATIONS.splice(convIdx, 1);
                CONVERSATIONS.unshift(conv);
            }

            conv.messages.push({
                id: `m-${Date.now()}`,
                senderId: CURRENT_USER_ID,
                text: text,
                time: "Just now"
            });

            renderCurrentPage();

            // Simulated response from peer student after ~1.4 seconds
            const peerId = activeChatUserId;
            setTimeout(() => {
                const replies = [
                    "Sounds great! Thanks for letting me know.",
                    "Got it! Let's follow up on that tomorrow.",
                    "Understood. See you around campus!",
                    "Appreciate the update! Let's stay in touch."
                ];
                const replyText = replies[Math.floor(Math.random() * replies.length)];

                const targetConv = CONVERSATIONS.find(c => c.userId === peerId);
                if (targetConv) {
                    targetConv.messages.push({
                        id: `m-${Date.now()}`,
                        senderId: peerId,
                        text: replyText,
                        time: "Just now"
                    });

                    // If not currently viewing that thread, increment unread badge
                    if (currentPage !== 'messages' || activeChatUserId !== peerId) {
                        targetConv.unread += 1;
                        showToast(`New message from ${USERS[peerId].name}`);
                        
                        // Add notification
                        NOTIFICATIONS.unshift({
                            id: `n-${Date.now()}`,
                            type: "user",
                            authorId: peerId,
                            text: "sent you a message",
                            time: "Just now",
                            unread: true
                        });
                        updateHeaderBadges();
                    }

                    if (currentPage === 'messages') {
                        renderCurrentPage();
                    }
                }
            }, 1400);
        }

        /* --------------------------------------------------------------------------
           14. Events & Calendar Page
           -------------------------------------------------------------------------- */
        function renderEventsPage(container) {
            const curMonth = calendarNavDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            container.innerHTML = `
                <div class="events-page-header">
                    <div>
                        <h1>Events & Calendar</h1>
                        <div class="page-subtitle">Plan ahead with the campus event board.</div>
                    </div>
                    <button class="btn btn-primary" onclick="openCreateEventDialog()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Create event
                    </button>
                </div>

                <!-- Calendar Card -->
                <div class="card">
                    <div class="calendar-nav-bar">
                        <div class="cal-nav-left">
                            <h2 style="font-size: 18px;">${calendarViewMode === 'month' ? curMonth : 'Week View'}</h2>
                            <div class="segmented-controls">
                                <button class="segment-btn ${calendarViewMode === 'month' ? 'active' : ''}" onclick="setCalendarView('month')">Month</button>
                                <button class="segment-btn ${calendarViewMode === 'week' ? 'active' : ''}" onclick="setCalendarView('week')">Week</button>
                            </div>
                        </div>
                        <div class="cal-nav-controls">
                            <button class="icon-btn" onclick="navCalendarPrev()" aria-label="Previous">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            </button>
                            <button class="btn btn-secondary btn-sm" onclick="navCalendarToday()">Today</button>
                            <button class="icon-btn" onclick="navCalendarNext()" aria-label="Next">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                        </div>
                    </div>

                    ${calendarViewMode === 'month' ? renderMonthGridHTML() : renderWeekGridHTML()}
                </div>

                <!-- Upcoming Events Card -->
                <div class="card">
                    <h2 style="margin-bottom: 16px;">All upcoming events</h2>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        ${EVENTS.length > 0 ? EVENTS.map(ev => {
                            const d = new Date(ev.date + 'T00:00:00');
                            const dayNum = d.getDate();
                            const monthAbbr = d.toLocaleString('default', { month: 'short' });
                            return `
                                <div class="event-row-compact" onclick="openEventDetails('${ev.id}')">
                                    <div class="date-block-48">
                                        <span class="day-num">${dayNum}</span>
                                        <span class="month-abbr">${monthAbbr}</span>
                                    </div>
                                    <div class="event-compact-info">
                                        <div class="event-compact-title">${ev.title}</div>
                                        <div class="text-muted">${ev.time} · ${ev.location}</div>
                                    </div>
                                    <span class="text-muted">${ev.date}</span>
                                </div>
                            `;
                        }).join('') : `
                            <div class="empty-state">
                                ${getForestIllustration()}
                                <div class="empty-state-text">No upcoming events. Create one to get started.</div>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function setCalendarView(mode) {
            calendarViewMode = mode;
            renderCurrentPage();
        }

        function navCalendarPrev() {
            if (calendarViewMode === 'month') {
                calendarNavDate.setMonth(calendarNavDate.getMonth() - 1);
            } else {
                calendarNavDate.setDate(calendarNavDate.getDate() - 7);
            }
            renderCurrentPage();
        }

        function navCalendarNext() {
            if (calendarViewMode === 'month') {
                calendarNavDate.setMonth(calendarNavDate.getMonth() + 1);
            } else {
                calendarNavDate.setDate(calendarNavDate.getDate() + 7);
            }
            renderCurrentPage();
        }

        function navCalendarToday() {
            calendarNavDate = new Date(2026, 9, 28);
            calendarSelectedDate = '2026-10-28';
            renderCurrentPage();
        }

        function renderMonthGridHTML() {
            const year = calendarNavDate.getFullYear();
            const month = calendarNavDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const startWeekday = (firstDay.getDay() + 6) % 7; // Mon = 0
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

            let html = `<div class="calendar-month-grid">`;
            weekdays.forEach(wd => {
                html += `<div class="cal-header-cell">${wd}</div>`;
            });

            // Blank cells for days before month starts
            for (let i = 0; i < startWeekday; i++) {
                html += `<div class="cal-day-cell other-month"></div>`;
            }

            // Days of the month
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = (dateStr === CURRENT_DATE_STR);
                const isSelected = (dateStr === calendarSelectedDate);

                // Find events on this day
                const dayEvents = EVENTS.filter(e => e.date === dateStr);

                html += `
                    <div class="cal-day-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="handleCalendarDateClick('${dateStr}')">
                        <div class="cal-day-cell-top">
                            <span class="cal-day-number">${d}</span>
                        </div>
                        ${dayEvents.map(ev => `
                            <div class="cal-event-chip" onclick="event.stopPropagation(); openEventDetails('${ev.id}')" title="${ev.title}">
                                ${ev.title}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Fill tail cells to keep clean grid
            const totalCells = startWeekday + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 0; i < remaining; i++) {
                html += `<div class="cal-day-cell other-month"></div>`;
            }

            html += `</div>`;
            return html;
        }

        function renderWeekGridHTML() {
            // Find Monday of the current week
            const curr = new Date(calendarNavDate);
            const day = (curr.getDay() + 6) % 7;
            const monday = new Date(curr);
            monday.setDate(curr.getDate() - day);

            const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            let html = `<div class="calendar-week-grid">`;

            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                const isToday = (dateStr === CURRENT_DATE_STR);
                const dayEvents = EVENTS.filter(e => e.date === dateStr);

                html += `
                    <div class="cal-week-col">
                        <div class="cal-week-col-header ${isToday ? 'today' : ''}">
                            <div class="weekday-label">${weekdays[i]}</div>
                            <div style="font-weight: 700; ${isToday ? 'color: var(--primary);' : ''}">${d.getDate()}</div>
                        </div>
                        <div class="cal-week-col-body" onclick="handleCalendarDateClick('${dateStr}')">
                            ${dayEvents.map(ev => `
                                <div class="cal-event-chip" onclick="event.stopPropagation(); openEventDetails('${ev.id}')">
                                    <strong>${ev.time}</strong> ${ev.title}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            return html;
        }

        function handleCalendarDateClick(dateStr) {
            calendarSelectedDate = dateStr;
            openCreateEventDialog(dateStr);
        }

        function openCreateEventDialog(prefilledDate = null) {
            document.getElementById('event-input-title').value = '';
            document.getElementById('event-input-date').value = prefilledDate || calendarSelectedDate || CURRENT_DATE_STR;
            document.getElementById('event-input-time').value = '10:00';
            document.getElementById('event-input-location').value = '';
            document.getElementById('event-input-details').value = '';
            document.getElementById('event-error-msg').style.display = 'none';
            document.getElementById('create-event-dialog').showModal();
        }

        function submitNewEvent() {
            const title = document.getElementById('event-input-title').value.trim();
            const date = document.getElementById('event-input-date').value;
            const time = document.getElementById('event-input-time').value || '10:00';
            const location = document.getElementById('event-input-location').value.trim() || 'Campus';
            const details = document.getElementById('event-input-details').value.trim();

            if (!title || !date) {
                document.getElementById('event-error-msg').style.display = 'block';
                return;
            }

            EVENTS.push({
                id: `ev-${Date.now()}`,
                title: title,
                date: date,
                time: time,
                location: location,
                details: details || "No further details yet."
            });

            // Sort events by date
            EVENTS.sort((a, b) => new Date(a.date) - new Date(b.date));

            closeDialog('create-event-dialog');
            showToast("Event added");
            renderCurrentPage();
            renderSidebarComponents();
        }

        function openEventDetails(eventId) {
            const ev = EVENTS.find(e => e.id === eventId);
            if (!ev) return;

            document.getElementById('ev-detail-title').textContent = ev.title;
            document.getElementById('ev-detail-date').textContent = ev.date;
            document.getElementById('ev-detail-time').textContent = ev.time;
            document.getElementById('ev-detail-loc').textContent = ev.location;
            document.getElementById('ev-detail-desc').textContent = ev.details || "No further details yet.";

            document.getElementById('event-details-dialog').showModal();
        }

        /* --------------------------------------------------------------------------
           15. Right Sidebar Components
           -------------------------------------------------------------------------- */
        function renderSidebarComponents() {
            // 1. Upcoming Events (Next 3 events from today onward)
            const upcomingContainer = document.getElementById('sidebar-upcoming-events');
            if (upcomingContainer) {
                const upcoming = EVENTS.filter(e => e.date >= CURRENT_DATE_STR).slice(0, 3);
                if (upcoming.length === 0) {
                    upcomingContainer.innerHTML = `<div class="text-muted" style="padding: 12px 0;">No upcoming events.</div>`;
                } else {
                    upcomingContainer.innerHTML = upcoming.map(ev => {
                        const d = new Date(ev.date + 'T00:00:00');
                        return `
                            <div class="event-row-compact" onclick="openEventDetails('${ev.id}')">
                                <div class="date-block-48">
                                    <span class="day-num">${d.getDate()}</span>
                                    <span class="month-abbr">${d.toLocaleString('default', { month: 'short' })}</span>
                                </div>
                                <div class="event-compact-info">
                                    <div class="event-compact-title">${ev.title}</div>
                                    <div class="text-muted">${ev.time} · ${ev.location}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            }

            // 2. Compact Calendar Preview
            const calGrid = document.getElementById('sidebar-calendar-grid');
            if (calGrid) {
                const year = 2026;
                const month = 9; // Oct
                const firstDay = new Date(year, month, 1);
                const startWeekday = (firstDay.getDay() + 6) % 7;
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                const headers = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
                let html = headers.map(h => `<div class="cal-preview-day-header">${h}</div>`).join('');

                for (let i = 0; i < startWeekday; i++) {
                    html += `<div class="cal-preview-cell empty"></div>`;
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `2026-10-${String(d).padStart(2, '0')}`;
                    const hasEv = EVENTS.some(e => e.date === dateStr);
                    const isToday = (dateStr === CURRENT_DATE_STR);

                    html += `
                        <div class="cal-preview-cell ${hasEv ? 'has-event' : ''} ${isToday ? 'today' : ''}" onclick="navigateTo('events'); calendarSelectedDate='${dateStr}';">
                            ${d}
                        </div>
                    `;
                }
                calGrid.innerHTML = html;
            }

            // 3. Online Now List
            const onlineContainer = document.getElementById('sidebar-online-list');
            if (onlineContainer) {
                const onlineUsers = Object.values(USERS).filter(u => u.online && u.id !== CURRENT_USER_ID);
                onlineContainer.innerHTML = onlineUsers.map(u => `
                    <div class="online-row" onclick="openChatWithUser('${u.id}')">
                        <div class="online-row-left">
                            ${renderAvatar(u, 'sm')}
                            <span class="online-name">${u.name}</span>
                        </div>
                        <div class="online-dot" aria-label="Online"></div>
                    </div>
                `).join('');
            }
        }

        /* --------------------------------------------------------------------------
           16. Header Search & Popovers
           -------------------------------------------------------------------------- */
        const searchInput = document.getElementById('global-search-input');
        const searchResultsBox = document.getElementById('search-results-box');

        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                const query = e.target.value.trim().toLowerCase().replace(/^@/, '');
                if (!query) {
                    searchResultsBox.style.display = 'none';
                    return;
                }

                const matches = Object.values(USERS).filter(u => {
                    return u.name.toLowerCase().includes(query) || u.username.toLowerCase().includes(query);
                });

                if (matches.length === 0) {
                    searchResultsBox.innerHTML = `<div style="padding: 14px; text-align: center;" class="text-muted">No students match your search.</div>`;
                } else {
                    searchResultsBox.innerHTML = matches.map(u => `
                        <div class="search-result-row" onclick="navigateTo('profile', '${u.id}'); closeSearchResults();">
                            ${renderAvatar(u, 'sm')}
                            <div>
                                <div style="font-weight: 600; font-size: 14px;">${u.name}</div>
                                <div class="text-muted">@${u.username} · ${u.department}</div>
                            </div>
                        </div>
                    `).join('');
                }
                searchResultsBox.style.display = 'block';
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const firstMatch = searchResultsBox.querySelector('.search-result-row');
                    if (firstMatch) firstMatch.click();
                }
            });
        }

        function closeSearchResults() {
            if (searchResultsBox) {
                searchResultsBox.style.display = 'none';
                if (searchInput) searchInput.value = '';
            }
        }

        // Popovers
        function togglePopover(popoverId) {
            const p = document.getElementById(popoverId);
            if (!p) return;
            const isOpen = p.classList.contains('open');
            closeAllPopovers();
            if (!isOpen) {
                p.classList.add('open');
                if (popoverId === 'notif-popover') renderNotificationsList();
            }
        }

        function closeAllPopovers() {
            document.querySelectorAll('.popover-menu').forEach(m => m.classList.remove('open'));
        }

        function renderNotificationsList() {
            const box = document.getElementById('notif-list-container');
            if (!box) return;

            if (NOTIFICATIONS.length === 0) {
                box.innerHTML = `<div class="empty-state" style="padding: 24px;"><div class="empty-state-text">No notifications yet.</div></div>`;
                return;
            }

            box.innerHTML = NOTIFICATIONS.map(n => {
                const author = USERS[n.authorId];
                return `
                    <div class="notification-item ${n.unread ? 'unread' : ''}" onclick="markNotificationRead('${n.id}')">
                        ${n.unread ? '<div class="unread-dot"></div>' : ''}
                        ${n.type === 'system' ? `
                            <div class="avatar sm" style="background-color: var(--primary);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            </div>
                        ` : renderAvatar(author, 'sm')}
                        <div class="notification-content">
                            <div><strong>${n.type === 'system' ? n.title : (author ? author.name : 'Someone')}</strong> ${n.text}</div>
                            <div class="text-muted" style="margin-top: 2px;">${n.time}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function markNotificationRead(notifId) {
            const n = NOTIFICATIONS.find(item => item.id === notifId);
            if (n) {
                n.unread = false;
                updateHeaderBadges();
                renderNotificationsList();
            }
        }

        function markAllNotificationsAsRead() {
            NOTIFICATIONS.forEach(n => n.unread = false);
            updateHeaderBadges();
            renderNotificationsList();
        }

        function updateHeaderBadges() {
            const unreadNotifs = NOTIFICATIONS.filter(n => n.unread).length;
            const notifBadge = document.getElementById('header-notif-badge');
            if (notifBadge) {
                notifBadge.textContent = unreadNotifs;
                notifBadge.style.display = unreadNotifs > 0 ? 'flex' : 'none';
            }

            const totalUnreadMessages = CONVERSATIONS.reduce((sum, c) => sum + (c.unread || 0), 0);
            const msgNavBadge = document.getElementById('nav-unread-count');
            if (msgNavBadge) {
                msgNavBadge.textContent = totalUnreadMessages;
                msgNavBadge.style.display = totalUnreadMessages > 0 ? 'inline-block' : 'none';
            }
        }

        /* --------------------------------------------------------------------------
           17. Toast Component & Global Click Listeners
           -------------------------------------------------------------------------- */
        let toastTimeout = null;

        function showToast(message) {
            const toast = document.getElementById('toast-message');
            if (!toast) return;

            toast.textContent = message;
            toast.style.display = 'block';

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 2400);
        }

        // Close popovers, search dropdowns, post menus when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.header-search')) {
                closeSearchResults();
            }
            if (!e.target.closest('.header-right')) {
                closeAllPopovers();
            }
            if (!e.target.closest('.post-menu-dropdown') && !e.target.closest('[aria-label="Post options"]')) {
                closeAllPostMenus();
            }
        });

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            updateHeaderBadges();
            renderCurrentPage();
            renderSidebarComponents();
        });
    </script>
</body>
</html>
